# ============================================================
# lxp-system · docker-compose.yml
#
# 用法：
#   cd deploy
#   TOKEN=你的密码 docker compose up -d
#
# 查看：  docker compose ps
# 日志：  docker compose logs -f
# 停止：  docker compose down
# 更新：  git pull → docker compose up -d --build
# ============================================================

services:
  lxp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lxp-system
    restart: unless-stopped        # 开机自启 + 崩溃自动重启
    ports:
      - "8080:8080"                # 宿主机端口:容器端口
    environment:
      - TOKEN=${TOKEN:?请设置 TOKEN 环境变量}
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - lxp-data:/app/data         # 数据持久化（data.json 独立于容器生命周期）
      - lxp-backup:/app/backup     # 备份目录
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lxp-data:
    driver: local
  lxp-backup:
    driver: local
